<body><h1>Grandma's Sloppy Joes</h1><p>Serves 6.</p>
<h2>Ingredients</h2><ul><li>2 lb ground beef</li><li>1 onion, chopped</li><li>1 cup ketchup</li><li>6 hamburger buns</li></ul>
<h2>Directions</h2><ol><li>Brown the beef with the onion.</li><li>Stir in ketchup and simmer.</li><li>Serve on buns.</li></ol></body></html>
