# Production: docker compose up -d   (reads .env next to this file)
# Local development only needs the database: docker compose up -d db
services:
  app:
    image: ${IMAGE:-xadamz23/hungry-hippos:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hh}:${POSTGRES_PASSWORD:-hh}@db:5432/${POSTGRES_DB:-hungry_hippos}
      BACKUP_DIR: /backups
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hh}
      POSTGRES_DB: ${POSTGRES_DB:-hungry_hippos}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nightly pg_dump at BACKUP_HOUR (local time) into the backups volume, keeping 14 days.
  # Restore: gunzip -c hh-YYYY-MM-DD.sql.gz | docker compose exec -T db psql -U hh hungry_hippos
  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hh}
      PGPASSWORD: ${POSTGRES_PASSWORD:-hh}
      PGDATABASE: ${POSTGRES_DB:-hungry_hippos}
      TZ: ${TZ:-America/Detroit}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          now=$$(date +%s)
          next=$$(date -d "today $${BACKUP_HOUR}:00" +%s)
          [ "$$next" -le "$$now" ] && next=$$(date -d "tomorrow $${BACKUP_HOUR}:00" +%s)
          sleep $$((next - now))
          file="/backups/hh-$$(date +%F).sql.gz"
          if pg_dump --no-owner | gzip > "$$file.tmp"; then mv "$$file.tmp" "$$file"; echo "backup written: $$file"
          else rm -f "$$file.tmp"; echo "backup FAILED" >&2; fi
          find /backups -name 'hh-*.sql.gz' -mtime +14 -delete
        done

volumes:
  pgdata:
  backups:
