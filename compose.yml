services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
      POSTGRES_DB: hungry_hippos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d hungry_hippos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
