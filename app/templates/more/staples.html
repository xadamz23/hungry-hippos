{% extends "base.html" %}
{% block title %}Staples · Hungry Hippos{% endblock %}
{% block main_class %}narrow-on-desktop{% endblock %}
{% block main %}
<div class="top">
  <a class="back" href="/more"><svg><use href="#i-back"/></svg>More</a>
  <h1 style="margin-top:10px">Staples</h1>
  <p class="meta">Things you buy all the time. They show up as quick-add buttons on the list.</p>
</div>
<form class="body" hx-post="/more/staples" hx-target="#staple-rows" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful) this.reset()">
  <div class="add"><label class="sr-only" for="new-staple">New staple</label><input id="new-staple" name="text" placeholder="Add a staple, e.g. 1 gal milk" autocomplete="off"><button type="submit">Add</button></div>
</form>
{% include "more/_staple_rows.html" %}
{% endblock %}
