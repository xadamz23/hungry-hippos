<div class="sheet-wrap" role="dialog" aria-modal="true" aria-labelledby="sheet-title" x-data="itemSheet"
     data-amount="{{ item.amounts|amounts }}">
  <div class="scrim" onclick="closeSheet()"></div>
  <form class="sheet glass-strong" hx-post="/list/{{ item.id }}" hx-target="#list-body">
    <div class="grab"></div>
    <div class="row">
      <h2 id="sheet-title" style="font-size:20px">{{ item.name|cap }}</h2>
      {% if item.sources %}<span class="muted small">From {{ item.sources|map(attribute='meal_name')|join(', ') }}</span>{% endif %}
    </div>
    <div class="field" style="margin-top:12px">
      <label for="amt">Amount</label>
      <div class="add glass-input">
        <button type="button" class="stepper" @click="bump(-1)" aria-label="Less">−</button>
        <input id="amt" name="amount" x-model="amt" placeholder="e.g. 2 lb" style="text-align:center;font-weight:700">
        <button type="button" class="stepper" @click="bump(1)" aria-label="More">+</button>
      </div>
    </div>
    <div class="field">
      <label for="note">Note</label>
      <textarea id="note" name="note" class="input glass-input" style="min-height:70px" placeholder="e.g. the big tub, ripe ones">{{ item.note or '' }}</textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px">
      <button type="button" class="btn btn-glass danger" hx-post="/list/{{ item.id }}/delete" hx-target="#list-body">Remove</button>
      <button type="submit" class="btn accent">Save</button>
    </div>
  </form>
</div>
