<div class="list-view" hx-ext="sse" sse-connect="/events" x-data="listView" :class="{ 'show-checked': showChecked }">
  <div class="top static" x-data="quickAdd">
    <div class="row">
      <h1>List</h1>
      <div class="seg sm" role="group" aria-label="Which items to show">
        <button type="button" @click="setShowChecked(false)" :aria-pressed="!showChecked" aria-pressed="true">To get</button>
        <button type="button" @click="setShowChecked(true)" :aria-pressed="showChecked" aria-pressed="false">All</button>
      </div>
    </div>
    <form class="add" style="margin-top:12px" hx-post="/list/add" hx-target="#list-body" hx-on::after-request="if(event.detail.successful) this.reset()" @reset="q = ''">
      <label class="sr-only" for="add-text">Add an item</label>
      <input id="add-text" name="text" placeholder="Add item, e.g. 2 lb apples" autocomplete="off" enterkeyhint="done" x-model="q"
             role="combobox" aria-autocomplete="list" aria-controls="add-suggest" aria-expanded="false"
             :aria-expanded="isOpen()" :aria-activedescendant="activeId()"
             @focus="open = true" @blur="open = false" @input="open = true"
             @keydown.arrow-down.prevent="move(1)" @keydown.arrow-up.prevent="move(-1)"
             @keydown.enter="pick($event)" @keydown.tab="pick($event)" @keydown.escape="open = false">
      <button type="submit">Add</button>
    </form>
    {% include "list/_staples.html" %}
  </div>
  <div id="list-body" hx-get="/list/items" hx-trigger="sse:list, visibilitychange[document.visibilityState=='visible'] from:document">
    {% include "list/_sections.html" %}
  </div>
</div>
